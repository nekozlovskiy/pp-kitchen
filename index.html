<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ПП-кухня Анюты</title>
    <meta name="description" content="Журнал ПП-рецептов для Анюты: 625 блюд с калориями, белками, жирами и углеводами на порцию." />
    <meta name="theme-color" content="#E6EEE0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111A14" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="ПП-кухня Анюты" />
    <meta property="og:description" content="Маленький журнал вкусной жизни: 625 ПП-рецептов с КБЖУ." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ПП-кухня" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифты не блокируют отрисовку: сначала системный шрифт, затем подмена -->
    <link
      rel="stylesheet"
      media="print"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Onest:wght@400;600;700&family=Unbounded:wght@600;800&display=swap"
      onload="this.onload=null;this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Onest:wght@400;600;700&family=Unbounded:wght@600;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- Обложка видна сразу, ещё до загрузки скриптов с рецептами; React заменит её той же разметкой.
         Текст посвящения должен совпадать с config.dedication (проверяет тест). -->
    <div id="root"><div class="shell"><div class="topbar wrap"><a class="topbar__brand" href="#/">ПП‑кухня</a></div><main class="home"><header class="cover wrap"><div class="masthead"><h1 class="masthead__title" aria-label="ПП-кухня"><span class="masthead__line">ПП‑</span><span class="masthead__line">кухня</span></h1><p class="masthead__dedication">Маленький журнал вкусной жизни. Посвящается Анюте, моему любимому шеф‑повару.</p><svg class="masthead__squiggle" viewBox="0 0 260 18" aria-hidden="true"><path d="M2 12c22-10 40 6 62-2s38-10 60 0 40 6 62-2 46-8 70 2" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" /></svg></div></header></main></div></div>
    <script>
      // Открыли сразу рецепт или другую страницу — обложка главной не нужна.
      if (location.hash.length > 2) document.querySelector(".shell").remove();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
